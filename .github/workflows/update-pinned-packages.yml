name: Update pinned packages

# Dependabot's nix ecosystem only tracks flake.lock inputs, so it can't bump
# packages pinned by tag or rev inside flake.nix. nix-update does: it updates
# the version, the pinned tag/rev, the source hash, and any dependent hashes
# (e.g. llama.cpp's npmDepsHash). Each package is bumped and verified in its
# own matrix leg, then opened as its own PR, so one broken update doesn't
# block the others.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, alongside the Dependabot run
  workflow_dispatch: # allow manual runs from the Actions tab

permissions: {}

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # llama.cpp is pinned to an upstream release tag (b<version>).
          - package: llama-cpp
            nix-update-args: --version=stable --version-regex 'b(.*)'
            verify: nix build .#llama-cpp -L
          # mtplx is pinned to a PyPI release (pure-python wheel);
          # nix-update resolves the latest version and hash from PyPI.
          # The build's pythonImportsCheck is the verification that the
          # new wheel still imports against the flake's dependency set.
          - package: mtplx
            nix-update-args: --version=stable
            verify: nix build .#mtplx -L
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Ensure the Metal toolchain is available
        if: matrix.package == 'llama-cpp'
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun -sdk macosx metal --version

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          diagnostic-endpoint: ""

      - name: Bump ${{ matrix.package }} with nix-update
        run: |
          nix run nixpkgs#nix-update -- \
            --flake \
            ${{ matrix.nix-update-args }} \
            ${{ matrix.package }}

      - name: Verify it builds
        run: ${{ matrix.verify }}

      - name: Capture changes
        id: diff
        run: |
          git diff > update.patch
          if [ -s update.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-${{ matrix.package }}
          path: update.patch

  # Only this job holds the write token, and only to open the PR. It runs on a
  # cheap Linux runner: applying a text patch needs no Nix or macOS. It runs
  # even if another matrix leg's build failed (!cancelled()), so one broken
  # package doesn't block the others' PRs; a leg whose build produced no patch
  # is skipped via the missing artifact.
  pull-request:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        package: [llama-cpp, mtplx]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download the patch
        id: patch
        continue-on-error: true # no artifact means no update for this package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch-${{ matrix.package }}

      - name: Apply the update
        if: steps.patch.outcome == 'success'
        run: |
          git apply update.patch
          rm update.patch

      - name: Open pull request
        if: steps.patch.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/update-${{ matrix.package }}
          title: "flake: bump ${{ matrix.package }}"
          commit-message: "flake: bump ${{ matrix.package }}"
          body: |
            Automated `${{ matrix.package }}` bump via `nix-update`.

            Updates the pinned version/rev and source hashes in `flake.nix`,
            verified to build on the runner before opening this PR.
          delete-branch: true
