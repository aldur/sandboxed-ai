name: Update llama.cpp

# Dependabot's nix ecosystem only tracks flake.lock inputs, so it can't bump the
# tag-pinned llama.cpp override in flake.nix. nix-update does: it updates the
# version/tag, the source hash, and the npmDepsHash. We then build it to confirm
# it compiles before opening a PR.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, alongside the Dependabot run
  workflow_dispatch: # allow manual runs from the Actions tab
  push:
    branches:
      - feat/ci # TEMPORARY: run on every push to this branch to test the workflow; remove before merge

# Least privilege: grant no token permissions by default. Each job opts into
# only what it needs (see per-job `permissions` below).
permissions: {}

jobs:
  # The heavy macOS build runs with a READ-ONLY token. It produces the proposed
  # change as a patch and hands it to the next job; it never needs write access.
  build:
    # macos-15 is Apple Silicon (aarch64-darwin), matching the flake's `system`.
    # It must build natively here: the flake only exposes packages.aarch64-darwin.*
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      patch: ${{ steps.diff.outputs.patch }}
    steps:
      # actions/checkout@v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # The Metal shader compiler (`xcrun metal`) lives in the full Xcode, not the
      # Command Line Tools. On Xcode 16 it's also a separately-downloadable
      # component. Without this, the Metal build fails with
      # `unable to find utility "metal"`.
      - name: Enable the Metal toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk macosx metal --version

      # DeterminateSystems/nix-installer-action@v22
      # - diagnostic-endpoint: "" disables the installer's telemetry/diagnostics.
      # - sandbox=true: nixpkgs' Darwin build grants its sandbox profile access to
      #   the host Metal toolchain (prepared above), so the build works sandboxed.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
        with:
          diagnostic-endpoint: ""
          extra-conf: |
            sandbox = true

      - name: Bump llama.cpp with nix-update
        run: |
          nix run nixpkgs#nix-update -- \
            --flake \
            --version=stable \
            --version-regex 'b(.*)' \
            llama-cpp

      # Gate the PR on a real build: if this fails, the job fails and the
      # pull-request job below never runs.
      - name: Verify it builds
        run: nix build .#llama-cpp -L

      # Export the change as a base64 patch. base64 keeps it on one line and makes
      # the value safe to interpolate later (no shell metacharacters). Empty when
      # llama.cpp is already up to date, which skips the pull-request job.
      - name: Capture changes
        id: diff
        run: echo "patch=$(git diff | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"

  # Only this job holds the write token, and only to open the PR. It runs on a
  # cheap Linux runner: applying a text patch needs no Nix or macOS.
  pull-request:
    needs: build
    if: needs.build.outputs.patch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # actions/checkout@v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Apply the update
        env:
          PATCH: ${{ needs.build.outputs.patch }}
        run: echo "$PATCH" | base64 -d | git apply

      # peter-evans/create-pull-request@v8.1.1
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: automated/update-llama-cpp
          title: "flake: bump llama.cpp"
          commit-message: "flake: bump llama.cpp"
          body: |
            Automated llama.cpp bump via `nix-update`.

            Updates `version`, `tag`, the source `hash`, and `npmDepsHash` in
            `flake.nix`. Verified to build on the runner with `nix build .#llama-cpp`.
          delete-branch: true
